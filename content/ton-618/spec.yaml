    - {text: "NUMBER 618", shot: starfield, params: {look: [0.08, 0.06, 1.0], gain: 1.6, marker: true, fov: 30}, at: 0.8, side: left}
    - {text: "HE NEVER CAME BACK", shot: black_hole, params: {dist: [28, 28], el: [2, 2], fov: [62, 62], look: [[-12, 0], [-12, 0]]}, at: 0.5, side: left}
