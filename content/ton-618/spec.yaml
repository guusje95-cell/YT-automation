id: ton-618
format: story
pillar: extreme-objects
status: draft
description_summary: >
  Based on a true story: in 1957 two astronomers in Mexico catalogued a faint blue dot as number 618. It turned out
  to be one of the brightest objects in the universe, powered by the heaviest black hole ever weighed. Jonah and Iris
  are a dramatization; every fact about TON 618 and black holes in this film is real and sourced below.
title_options:
  - "TON 618: The Black Hole That Shouldn't Exist (Based on a True Story)"
  - "Falling Into the Biggest Black Hole in the Universe"
  - "What Happens If You Fall Into TON 618"
