scenes:
  - id: hook
    chapter: "Intro"
    narration: >
      The sunlight reaching your eyes right now left the surface of the Sun about eight minutes ago.
      But the energy carried by that light began its journey much earlier, deep in the core,
      and estimates for how long it took to work its way out run from about 170,000 years to around a million.
      So what is it travelling through? The Sun has no solid surface and no crust, but it does have layers,
      each with its own rules. Let's go from the centre to the edge, one layer at a time,
      and end with one of the strangest open questions in solar physics: why the Sun's outer atmosphere is hundreds of times hotter than its surface.
    claims:
      - {text: "Distance ~150 million km; light travel time ~8 min derived from distance / speed of light", sources: [nasa_sun_facts]}
      - {text: "Energy takes ~170,000 years from core to top of convection zone (NASA Sun Facts); photon ~1 million years to reach the interface layer (NASA MSFC)", sources: [nasa_sun_facts, msfc_interior]}
      - {text: "Corona up to 2 million C vs photosphere 5,500 C (hundreds of times hotter)", sources: [nasa_sun_facts]}
    beats:
      - {type: image, asset: sun_red, motion: in, sentences: 1}
      - {type: fact, big: "170,000 – 1,000,000 years", small: "published NASA estimates for energy to work its way out of the Sun", source_label: "NASA Science; NASA Marshall Solar Physics", sentences: 1}
      - {type: image, asset: churning, motion: pan_left, sentences: 1}
      - {type: image, asset: prominence, motion: in, sentences: 1}
      - {type: title, text: "What's Actually Inside the Sun", kicker: "From the core to the corona, layer by layer", sentences: 1}

  - id: scale
    chapter: "First, the scale"
    narration: >
      First, a sense of scale. The Sun is about 1.4 million kilometres across, roughly a hundred times wider than Earth.
      You could fit about 1.3 million Earths inside it.
      And it holds 99.8 percent of all the mass in the solar system. Everything else, every planet, moon and asteroid, is the leftovers.
      All of that mass is pulling inward. The only reason the Sun does not collapse is that something in the middle is pushing back.
    claims:
      - {text: "Diameter ~1.4 million km; ~100 times wider than Earth", sources: [nasa_sun_facts]}
      - {text: "1.3 million Earths fit inside", sources: [nasa_sun_facts]}
      - {text: "99.8 percent of the solar system's mass", sources: [nasa_sun_facts]}
      - {text: "Fusion outward pressure supports the Sun against collapse", sources: [nasa_sun_facts]}
    beats:
      - {type: scale, mode: circles, title: "Width, to scale",
         items: [{label: Earth, value: 12742, color: [90, 140, 230]}, {label: Jupiter, value: 139820, color: [210, 170, 120]},
                 {label: Sun, value: 1392700, color: [255, 180, 60], note: "≈100× Earth"}], sentences: 1}
      - {type: fact, big: "1.3 million", small: "Earths would fit inside the Sun", source: nasa_sun_facts, sentences: 1}
      - {type: fact, big: "99.8%", small: "of the solar system's mass is in the Sun", source: nasa_sun_facts, sentences: 2}
      - {type: image, asset: active, motion: in, sentences: 2}

  - id: core
    chapter: "1. The core"
    narration: >
      Layer one is the core, the innermost quarter of the Sun's radius.
      The temperature here is about 15 million degrees Celsius,
      and the material is packed to around 150 grams per cubic centimetre, roughly eight times the density of gold.
      Under those conditions, hydrogen nuclei collide hard enough to fuse into helium, releasing energy.
      The burning is concentrated here. By the edge of the core, about 175,000 kilometres from the centre,
      the temperature has dropped to roughly half, and fusion almost stops.
      That energy is the push that holds the whole star up.
      Most of it comes from a chain of reactions that starts with hydrogen.
      But a small share, about one percent, comes from a different route that uses carbon, nitrogen and oxygen as helpers.
      For decades that second route was only theory. Then, in 2020, the Borexino experiment, buried under a mountain in Italy,
      detected neutrinos from it. Neutrinos barely interact with anything, so they fly straight out of the core,
      and catching them is the closest thing we have to looking directly inside.
      For years, detectors caught fewer solar neutrinos than theory predicted.
      That puzzle was finally resolved when physicists discovered that neutrinos have mass,
      which lets them change type on their way to Earth.
    claims:
      - {text: "Core is the innermost 25% of the radius", sources: [msfc_interior]}
      - {text: "Core ~15 million C; density ~150 g/cm3, ~8x gold", sources: [nasa_sun_facts]}
      - {text: "Fusion of hydrogen into helium in the core", sources: [nasa_sun_facts]}
      - {text: "CNO cycle ~1 percent of the Sun's energy; first detected by Borexino (Nature, 2020)", sources: [borexino_2020]}
      - {text: "Fusion nearly stops at the core's edge, 25% out (175,000 km from centre), temperature about half the central value", sources: [msfc_interior]}
      - {text: "Fewer neutrinos detected than expected; resolved by discovery of neutrino masses", sources: [msfc_interior]}
    beats:
      - {type: scale, mode: layers, title: "Inside the Sun", labels: ["Core (inner 25%)", "Radiative zone (25–70%)", "Convection zone (outer 30%)"], highlight: 0, sentences: 1}
      - {type: fact, big: "15 million °C", small: "temperature in the core", source: nasa_sun_facts, sentences: 1}
      - {type: fact, big: "8× gold", small: "density of the core (≈150 g/cm³)", source: nasa_sun_facts, sentences: 1}
      - {type: image, asset: blue, motion: in, sentences: 2}
      - {type: image, asset: wavelengths, motion: pan_right, sentences: 3}
      - {type: fact, big: "2020", small: "Borexino detects neutrinos from the Sun's CNO cycle", source: borexino_2020, sentences: 1}
      - {type: image, asset: magnetic, motion: in, sentences: 2}
      - {type: image, asset: blue, motion: out, sentences: 3}

  - id: radiative
    chapter: "2. The radiative zone"
    narration: >
      Layer two is the radiative zone, from about a quarter of the way out to about seventy percent of the radius.
      Here, energy travels as light, but not in a straight line.
      The plasma is so dense that each bit of light is absorbed and re-emitted again and again, in random directions.
      It is like trying to leave a stadium crowd where every person you bump into spins you around.
      Across this zone, the temperature falls from about 7 million degrees to about 2 million,
      and the density drops from around 20 grams per cubic centimetre to just 0.2, less dense than water.
      This is the slow part of the journey, and the main reason the trip out takes so long.
      How long, exactly, depends on the model and on what you count.
      NASA's Sun fact sheet gives about 170,000 years for energy to reach the top of the convection zone.
      NASA's Marshall solar physics group puts a photon's trip across the radiative zone alone at about a million years.
      Either way, the energy in today's sunlight set off long before the first cities were built.
      At the top of this zone sits a thin boundary called the tachocline,
      where scientists think the Sun's magnetic field is generated.
    claims:
      - {text: "Radiative zone from 25% to 70% of the radius; energy moves by radiation", sources: [msfc_interior]}
      - {text: "Temperature falls from ~7,000,000 C to ~2,000,000 C; density from ~20 to 0.2 g/cm3 (less than water)", sources: [msfc_interior]}
      - {text: "Photon ~1 million years to reach the interface layer", sources: [msfc_interior]}
      - {text: "Tachocline: thin interface where magnetic field thought to be generated", sources: [msfc_interior]}
      - {text: "~170,000 years for energy from core to top of convection zone", sources: [nasa_sun_facts]}
    beats:
      - {type: scale, mode: layers, title: "Inside the Sun", labels: ["Core (inner 25%)", "Radiative zone (25–70%)", "Convection zone (outer 30%)"], highlight: 1, sentences: 1}
      - {type: image, asset: spotless, motion: in, sentences: 2}
      - {type: image, asset: churning, motion: in, sentences: 2}
      - {type: fact, big: "0.2 g/cm³", small: "density at the top of the radiative zone: less than water", source: msfc_interior, sentences: 2}
      - {type: fact, big: "170,000 – 1,000,000 years", small: "estimates for the journey out vary by model and definition", source_label: "NASA Science; NASA Marshall Solar Physics", sentences: 3}
      - {type: image, asset: soho_handle, motion: out, sentences: 1}
      - {type: image, asset: magnetic, motion: out, sentences: 2, label: "Magnetic field lines (model over SDO image)"}

  - id: convection
    chapter: "3. The convection zone"
    narration: >
      Layer three is the convection zone, the outer thirty percent, starting about 200,000 kilometres below the surface.
      Here the plasma is cool enough, below about two million degrees, that light can no longer push the energy along efficiently.
      So the Sun starts to boil. Hot plasma rises, cools at the top, and sinks again, in enormous loops.
      You can see the tops of these loops on the surface as a grainy pattern of granules.
      By the time the plasma reaches the top, it is astonishingly thin, about ten thousand times less dense than the air you are breathing.
      This churning motion also twists the magnetic field, which is why the surface is covered in sunspots, loops and eruptions.
    claims:
      - {text: "Convection zone is the outer 30%, from ~200,000 km deep to the surface", sources: [msfc_interior]}
      - {text: "Surface density ~0.0000002 g/cm3, ~1/10,000 of sea-level air", sources: [msfc_interior]}
      - {text: "Temperature drops below 2 million C in the convection zone", sources: [nasa_sun_facts]}
      - {text: "Convection appears at the surface as granules and supergranules", sources: [nasa_layers_2023]}
    beats:
      - {type: scale, mode: layers, title: "Inside the Sun", labels: ["Core (inner 25%)", "Radiative zone (25–70%)", "Convection zone (outer 30%)"], highlight: 2, sentences: 1}
      - {type: image, asset: active, motion: pan_left, sentences: 2}
      - {type: image, asset: churning, motion: out, sentences: 1}
      - {type: fact, big: "1/10,000", small: "the density of the visible surface compared with sea-level air", source: msfc_interior, sentences: 1}
      - {type: image, asset: flare, motion: in, sentences: 1, label: "Solar flare (SDO)"}

  - id: surface
    chapter: "4. The surface and atmosphere"
    narration: >
      At last, the light escapes. The photosphere is what we call the Sun's surface,
      although it is not solid. It is a layer about 400 kilometres thick, at roughly 5,500 degrees Celsius.
      From here, the light needs only those eight minutes to reach us.
      Above it, things get strange. In the next layer, the chromosphere, the temperature climbs instead of falling,
      from about 6,000 to around 20,000 degrees.
      Then comes a thin transition region, and above that the corona, the Sun's outer atmosphere,
      which reaches temperatures of up to 2 million degrees.
      You normally cannot see the corona, because the photosphere is far too bright.
      During a total solar eclipse, when the Moon blocks the disc, it appears as a pale glowing halo.
    claims:
      - {text: "Photosphere ~250 miles (~400 km) thick, ~5,500 C", sources: [nasa_sun_facts]}
      - {text: "Chromosphere temperature rises from 6,000 C to about 20,000 C", sources: [nasa_layers_2023]}
      - {text: "Thin transition region between chromosphere and corona", sources: [nasa_layers_2023]}
      - {text: "Corona up to 2 million C", sources: [nasa_sun_facts]}
    beats:
      - {type: image, asset: sun_red, motion: out, sentences: 2}
      - {type: fact, big: "5,500 °C", small: "the visible surface (photosphere)", source: nasa_sun_facts, sentences: 1}
      - {type: image, asset: prominence2, motion: in, sentences: 2}
      - {type: fact, big: "2 million °C", small: "the corona, the Sun's outer atmosphere", source: nasa_sun_facts, sentences: 2}
      - {type: image, asset: eclipse, motion: in, zoom: 0.25, sentences: 2, label: "Total solar eclipse, 21 Aug 2017"}

  - id: mystery
    chapter: "5. The hot corona mystery"
    narration: >
      That is the puzzle. The further you move from the furnace at the centre, the cooler things should get.
      Instead, the corona is hundreds of times hotter than the surface beneath it.
      NASA describes the heating of the corona as a major unsolved puzzle in heliophysics.
      To study it up close, NASA launched the Parker Solar Probe.
      On the twenty-eighth of April 2021, it crossed into the corona for the first time,
      passing a boundary called the Alfvén critical surface, about 18.8 solar radii from the Sun.
      It was the first time a spacecraft had flown through the Sun's atmosphere,
      measuring the particles and magnetic fields where the solar wind is born.
      The answer is not settled yet. But for the first time, we are taking measurements from inside the place where it happens.
    claims:
      - {text: "Corona heating is a major unsolved puzzle in heliophysics", sources: [nasa_layers_2023]}
      - {text: "Parker crossed the Alfvén critical surface on April 28, 2021 at ~18.8 solar radii; first spacecraft in the corona", sources: [nasa_parker_2021]}
      - {text: "Corona hundreds of times hotter than photosphere (2 million C vs 5,500 C)", sources: [nasa_sun_facts]}
    beats:
      - {type: image, asset: eclipse, motion: out, zoom: 0.2, sentences: 2}
      - {type: image, asset: soho_handle, motion: in, sentences: 1, label: "Prominence (SOHO, extreme ultraviolet)"}
      - {type: video, asset: parker_anim, from: 4, sentences: 3, label: "Parker Solar Probe (NASA animation)"}
      - {type: fact, big: "18.8 solar radii", small: "where Parker crossed into the corona, 28 April 2021", source: nasa_parker_2021, sentences: 1}
      - {type: video, asset: parker_anim, from: 30, sentences: 2}

  - id: outro
    chapter: "What happens next"
    narration: >
      The Sun is about 4.6 billion years old and a little less than halfway through its life.
      In about five billion years, it will swell into a red giant, possibly engulfing Mercury, Venus, and perhaps Earth,
      before shrinking into a white dwarf.
      Until then, the same layered engine keeps running: fusion in the core, a long slow glow through the radiative zone,
      boiling in the convection zone, and light that finally escapes, eight minutes away from you.
      If you want more space explained with real images and real numbers, subscribe. Every source is linked in the description.
    claims:
      - {text: "Formed ~4.6 billion years ago; a little less than halfway through its lifetime", sources: [nasa_sun_facts]}
      - {text: "In ~5 billion years red giant possibly engulfing Mercury, Venus, perhaps Earth; then white dwarf", sources: [nasa_sun_facts]}
    beats:
      - {type: image, asset: bastille, motion: in, sentences: 1}
      - {type: fact, big: "≈5 billion years", small: "until the Sun becomes a red giant", source: nasa_sun_facts, sentences: 2}
      - {type: image, asset: prominence, motion: out, sentences: 2}
      - {type: end, text: "Real images. Real numbers.", sentences: 1}
