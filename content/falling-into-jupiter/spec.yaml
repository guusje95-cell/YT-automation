  style: cinematic
  variants:
    - {text: "FALLING INTO JUPITER", shot: entry, at: 0.55, side: left}
    - {text: "NOBODY HAS SEEN THIS", shot: fluid, params: {mode: metallic, seed: 9}, at: 0.5, side: left}
    - {text: "THE LAST SIGNAL", asset: probe_painting, crop: [0.13, 0.03, 0.93, 0.86], focus: [0.65, 0.5], side: left}
