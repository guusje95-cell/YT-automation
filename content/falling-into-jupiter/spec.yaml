scenes:
  - id: cold_open
    chapter: null
    narration: >
      On the seventh of December, 1995, at four minutes past ten at night, Universal Time, a small probe hit the top of Jupiter's atmosphere at a hundred and seventy thousand kilometres an hour.
      Within a minute, the gas in front of it was hotter than the surface of the Sun.
      It carried six instruments, a parachute and a radio.
      It was never meant to come back.
      For fifty-eight minutes, it sent data home.
      Then the signal stopped.
      This is the story of how far it got.
      And of what lies beneath it, all the way to the centre, in a place no machine will ever reach.
    claims:
      - {text: "Entry 22:04:44 UT Dec 7, 1995 at 106,000 mph (170,590 km/h)", sources: [nasa_probe]}
      - {text: "Shock temperature ~16,000 C about a minute after entry vs Sun surface ~5,500 C", sources: [nasa_probe, nasa_sun_facts]}
      - {text: "Six instruments; descent by parachute", sources: [nasa_probe]}
      - {text: "Returned data for 58 minutes", sources: [nasa_probe]}
    beats:
      - {type: r3d, shot: orbit, params: {dist: [5.5, 4.2], az: [0.7, 0.55], el: [0.12, 0.1], fov: [36, 34], light: [70, 15], streak: true},
         sentences: 1, hud: {date: "07 DEC 1995", clock: ["22:04:30", "22:04:44"], speed: [170590, 170590, "km/h"], status: "ENTRY"}}
      - {type: r3d, shot: entry, params: {}, sentences: 1, hud: {clock: ["22:04:44", "22:05:44"], temp: [2000, 16000, "°C"], status: "PEAK HEATING"}}
      - {type: image, asset: probe_hardware, motion: in, crop: [0.1, 0.05, 0.95, 0.9], sentences: 1, label: "The Galileo probe, 1984 (NASA Ames)"}
      - {type: image, asset: probe_painting2, motion: in, crop: [0.04, 0.12, 0.96, 0.96], sentences: 1, label: "Artist's impression, NASA Ames"}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, lightning: 0.6, seed: 4}, sentences: 1, hud: {clock: ["22:05", "23:02"], status: "TELEMETRY OK"}}
      - {type: glitch, text: "SIGNAL LOST", sentences: 1}
      - {type: r3d, shot: cutaway, params: {marker: [1.0, 0.02], az: [0.35, 0.1]}, sentences: 1}
      - {type: r3d, shot: crescent, params: {dist: [3.3, 3.0], az: [0.35, 0.2]}, title: "Falling into Jupiter", sentences: 1}

  - id: arrival
    chapter: "The giant"
    narration: >
      Jupiter is eleven times wider than Earth.
      More than a thousand Earths could fit inside it.
      It holds more than twice the material of every other planet, moon and asteroid in the solar system combined.
      And it has no surface. Nothing to land on. Just gas, getting thicker and hotter the deeper you go.
      The probe's journey began five months before it arrived.
      In July 1995, it separated from its mothership, the Galileo orbiter, about eighty million kilometres from Jupiter, and coasted the rest of the way alone.
      Its first danger wasn't the planet itself.
      About fifty thousand kilometres above the clouds, it flew through an intense belt of radiation, particles trapped and accelerated by Jupiter's magnetic field.
      Hold on to that. We'll find out where that field comes from at the bottom of this journey.
    claims:
      - {text: "11 times wider than Earth; 1,000 Earths could fit inside (hollow shell)", sources: [nasa_jupiter_facts]}
      - {text: "More than twice the combined material of the other bodies in the solar system", sources: [nasa_jupiter_facts]}
      - {text: "No solid surface; gas thickens with depth (surface pressure >>1000 bars)", sources: [nssdc_jupiter, nasa_jupiter_facts]}
      - {text: "Probe released July 13, 1995, ~80 million km from Jupiter (~5 months before entry)", sources: [nasa_probe]}
      - {text: "Intense radiation belt ~50,000 km above the clouds", sources: [nasa_probe]}
      - {text: "Magnetosphere traps and accelerates particles creating intense radiation", sources: [nasa_jupiter_facts]}
    beats:
      - {type: r3d, shot: scale_compare, params: {}, sentences: 2}
      - {type: r3d, shot: orbit, params: {dist: [3.4, 3.0], az: [-0.3, 0.1], el: [0.2, 0.12], light: [65, 20], spin: [0.5, 0.8]}, sentences: 1}
      - {type: r3d, shot: flyover, params: {alt: [0.22, 0.14], lon: [30, 15], lat: [-8, -12], pitch: [30, 24], light: [150, 18]}, sentences: 3}
      - {type: image, asset: galileo_orbiter, motion: in, sentences: 1, label: "Galileo orbiter (artist's concept)", hud: {date: "13 JUL 1995", distance: [80000000, 80000000, "km"], status: "PROBE RELEASE"}}
      - {type: image, asset: galileo_orbiter, motion: pan_left, sentences: 1}
      - {type: video, asset: magnetosphere, from: 5, sentences: 2, label: "Jupiter's magnetosphere (NASA visualization)", hud: {altitude: [80000, 50000, "km"], status: "RADIATION"}}
      - {type: r3d, shot: crescent, params: {dist: [3.2, 2.9], light: [105, 12]}, sentences: 2}

  - id: entry
    chapter: "Entry"
    narration: >
      Jupiter's gravity is so strong that anything falling in from far away hits the atmosphere at close to sixty kilometres per second.
      The probe arrived at about forty-seven.
      A minute after entry, it was slowing down so hard that it felt two hundred and twenty-eight times the force of gravity.
      If you'd been on board, your body would have weighed more than fifteen tonnes.
      Its heat shield was taking the hit from gas at sixteen thousand degrees.
      Then, as it slowed, a parachute opened, and it began to sink, measuring everything around it.
    claims:
      - {text: "Escape velocity 59.5 km/s: objects falling from far away arrive at about escape speed", sources: [nssdc_jupiter]}
      - {text: "Entry speed 170,590 km/h = 47.4 km/s", sources: [nasa_probe]}
      - {text: "Maximum deceleration 228 g about a minute after entry", sources: [nasa_probe]}
      - {text: "228 x 70 kg = ~16 tonnes (derived)", sources: [nasa_probe]}
      - {text: "Temperatures reached 16,000 C", sources: [nasa_probe]}
      - {text: "Data returned by parachute descent", sources: [nasa_probe]}
    beats:
      - {type: r3d, shot: approach, params: {dist: [10, 2.6], fov: [28, 40]}, sentences: 1, hud: {speed: [59.5, 59.5, "km/s"], status: "FREE FALL"}}
      - {type: r3d, shot: entry, params: {}, sentences: 1, hud: {speed: [47.4, 47.4, "km/s"], status: "ENTRY"}}
      - {type: r3d, shot: entry, params: {lon: 40, lat: -14}, sentences: 2, hud: {g: [12, 228, "g"], status: "MAX DECELERATION"}}
      - {type: image, asset: probe_painting, motion: in, crop: [0.07, 0.03, 0.92, 0.86], sentences: 1, hud: {temp: [9000, 16000, "°C"], status: "HEAT SHIELD"}, label: "Artist's impression, NASA Ames"}
      - {type: image, asset: probe_painting2, motion: out, crop: [0.04, 0.12, 0.96, 0.96], sentences: 1, hud: {status: "PARACHUTE DEPLOYED"}}

  - id: clouds
    chapter: "Into the clouds"
    narration: >
      At the very top of the atmosphere, the pressure is only a tenth of what you feel at sea level, and the temperature is minus one hundred and sixty degrees.
      A little lower, at the same pressure as the air around you right now, it's still minus one hundred and eight.
      Jupiter's weather happens in three layers of cloud, about seventy-one kilometres thick in total.
      The top layer is probably ammonia ice, the bright white bands you see from space.
      Deeper down are clouds of water, and they make lightning.
      Juno would later find something stranger in those storms: lightning flashing high up, where it should be too cold for liquid water.
      The likely explanation is hail made of ammonia and water slush, nicknamed mushballs, falling out of the storms.
      The Galileo probe saw less of all this than anyone expected. Less water, less lightning, and only half the helium scientists had predicted near the top.
      Years later, Juno helped explain why. The probe had most likely fallen into an unusually dry spot, a desert patch in Jupiter's sky.
    claims:
      - {text: "0.1 bar: -161 C; 1 bar: -108 C", sources: [nssdc_jupiter]}
      - {text: "Three distinct cloud layers spanning about 71 km; top layer probably ammonia ice", sources: [nasa_jupiter_facts]}
      - {text: "Water clouds and lightning; shallow lightning at high altitude; mushballs (ammonia-water hail)", sources: [jpl_mushballs_2020]}
      - {text: "Probe found less lightning, less water vapor, half the expected helium in upper atmosphere", sources: [nasa_probe]}
      - {text: "Galileo probe likely entered an unusually dry spot", sources: [jpl_water_2020]}
    beats:
      - {type: r3d, shot: cloud_dive, params: {decks: 1, seed: 11}, sentences: 2, hud: {pressure: [0.1, 1.0, "bar"], temp: [-161, -108, "°C"], depth: [0, 20, "km"], status: "DESCENT"}}
      - {type: profile, sentences: 1}
      - {type: image, asset: belts, motion: pan_right, fit: contain, sentences: 1, label: "Ammonia-ice cloud bands (JunoCam)"}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, lightning: 2.0, seed: 21, layers: [["dive_tkachenko.jpg", [0.0, 0.0, 1.0, 0.75]], ["detail_swift.jpg", [0.0, 0.0, 0.8, 0.75]]]}, sentences: 1, hud: {depth: [71, 100, "km"], status: "WATER CLOUDS"}}
      - {type: image, asset: lightning_art, motion: up, sentences: 1, label: "Lightning on Jupiter (artist's concept from Juno data)"}
      - {type: image, asset: mushball_diagram, motion: in, fit: contain, sentences: 1, label: "How 'mushballs' may form (NASA/JPL illustration)"}
      - {type: fact_list, title: "What the probe found", items: ["Less water than expected", "Less lightning", "Half the predicted helium near the top"], source: nasa_probe, sentences: 2}
      - {type: image, asset: entry_site, motion: in, fit: contain, crop: [0.0, 0.0, 1.0, 0.86], sentences: 2, label: "The probe's entry site, imaged by Hubble weeks before arrival"}

  - id: signal_lost
    chapter: null
    narration: >
      Fifty-eight minutes in, the science data stopped.
      At sixty-one minutes, the transmitter failed, about a hundred and eighty kilometres below the point where it entered, at nearly twenty-three times the pressure at sea level.
      Whatever was left of it kept sinking into the dark.
      From here on down, no machine has ever gone.
    claims:
      - {text: "Data for 58 minutes; transmitter failed 61.4 minutes after entry, ~180 km below entry point, 22.7 atmospheres", sources: [nasa_probe]}
    beats:
      - {type: r3d, shot: cloud_dive, params: {decks: 1, seed: 31, layers: [["detail_swift.jpg", [0.0, 0.0, 0.8, 0.75]], ["dive_tkachenko.jpg", [0.0, 0.3, 1.0, 1.0]]], depth_tint: [[0.8, 0.6, 0.45], [0.45, 0.3, 0.2]]}, sentences: 1, hud: {clock: ["T+57:30", "T+58:00"], depth: [150, 165, "km"], pressure: [19, 21, "bar"], status: "TELEMETRY DEGRADED"}}
      - {type: glitch, text: "SIGNAL LOST", sub: "T+61.4 min · ~180 km · 22.7 bar", sentences: 1}
      - {type: black, sentences: 1}
      - {type: r3d, shot: cutaway, params: {marker: [1.0, 0.997], az: [0.1, 0.0], target: [[0.78, 0.08, 0.59], [0.0, -0.05, 0.0]], dist: [0.6, 2.8], fov: [32, 36]}, sentences: 1, label: "The probe's entire descent: the thin line at the very edge"}

  - id: juno
    chapter: "Beyond the probe"
    narration: >
      To follow it further, we need a different kind of explorer.
      In 2016, NASA's Juno spacecraft began looping over Jupiter's poles, measuring the planet from the outside: its gravity, its magnetism, and microwaves glowing up from deep below the clouds.
      And it found that the weather doesn't stop at the clouds.
      The famous stripes are jet streams, and they reach about three thousand kilometres down.
      The Great Red Spot, a storm twice as wide as Earth, has roots between three hundred and fifty and five hundred kilometres deep.
      A storm wider than our planet, with roots so deep that the probe's entire descent would fit inside them twice.
    claims:
      - {text: "Juno arrived 2016; polar orbits; gravity, magnetic and microwave measurements", sources: [nasa_juno]}
      - {text: "Belts and zones are jet streams extending ~3,000 km below cloud tops", sources: [nasa_juno]}
      - {text: "GRS twice as wide as Earth", sources: [nasa_jupiter_facts]}
      - {text: "GRS roots >350 km (MWR) to ~500 km (gravity)", sources: [jpl_3d_2021]}
      - {text: "Probe failed ~180 km down: 350-500 km is about 2-3x deeper (derived)", sources: [nasa_probe, jpl_3d_2021]}
    beats:
      - {type: image, asset: juno_art, motion: in, sentences: 1, label: "Juno (artist's concept)"}
      - {type: r3d, shot: polar_orbit, params: {}, sentences: 1}
      - {type: image, asset: grs_slices, motion: in, fit: contain, sentences: 1, label: "Juno microwave 'slices' beneath the clouds"}
      - {type: r3d, shot: cutaway, params: {layers: [[1.0, [0.95, 0.72, 0.45], [0.9, 0.62, 0.38]], [0.957, [0.62, 0.45, 0.32], [0.5, 0.36, 0.26]], [0.8, [0.36, 0.42, 0.70], [0.28, 0.33, 0.62]], [0.55, [0.95, 0.60, 0.28], [1.0, 0.86, 0.58]]], az: [0.3, 0.2], target: [[0.0, 0.0, 0.0], [0.0, 0.85, 0.1]], dist: [3.0, 0.7], el: [0.3, 0.35]},
         sentences: 1, label: "Jet streams reach ~3,000 km down (about 4% of the radius)"}
      - {type: image, asset: grs_closeup, motion: in, sentences: 1, label: "The Great Red Spot (JunoCam)"}
      - {type: image, asset: grs_size, motion: in, fit: contain, sentences: 1, label: "Great Red Spot depth vs. Earth (NASA/JPL illustration)"}

  - id: ocean
    chapter: "The ocean with no surface"
    narration: >
      Keep falling, and the pressure keeps rising.
      Hydrogen, the gas that makes up almost ninety percent of Jupiter, is squeezed so hard that it turns into a liquid.
      There is no clear surface to splash into. The gas just gets denser and hotter until you are no longer falling through air. You are sinking through an ocean.
      And perhaps halfway to the centre, something even stranger happens.
      The pressure becomes so great that electrons are squeezed off the hydrogen atoms.
      The liquid starts to conduct electricity, like a metal.
    claims:
      - {text: "Hydrogen ~89.8% by volume", sources: [nssdc_jupiter]}
      - {text: "Deep pressure compresses hydrogen gas into a liquid", sources: [nasa_jupiter_facts]}
      - {text: "Perhaps halfway to the centre, electrons squeezed off; liquid conducts electricity like metal", sources: [nasa_jupiter_facts]}
    beats:
      - {type: r3d, shot: cutaway, params: {marker: [0.96, 0.85], az: [0.2, 0.05], target: [[0.7, 0.08, 0.5], [0.0, -0.05, 0.0]], dist: [1.1, 2.7]}, sentences: 1, hud: {depth: [3000, 10500, "km"], status: "DESCENDING"}}
      - {type: r3d, shot: fluid, params: {mode: liquid}, sentences: 1}
      - {type: r3d, shot: fluid, params: {mode: liquid, darker: true}, sentences: 3}
      - {type: r3d, shot: cutaway, params: {marker: [0.85, 0.52], az: [0.05, -0.1]}, sentences: 1, hud: {depth: [10500, 33500, "km"], status: "≈ HALFWAY"}}
      - {type: r3d, shot: fluid, params: {mode: metallic}, sentences: 2}

  - id: engine
    chapter: "The engine"
    narration: >
      This is the answer to the danger at the start of our journey.
      An ocean of liquid metal, churning inside a planet that spins once every ten hours, works like a giant dynamo.
      It generates a magnetic field sixteen to fifty-four times as powerful as Earth's.
      That's the field that trapped the radiation the probe flew through on its way in.
      Juno mapped it, and it's lumpy. Near the equator sits an intense patch scientists call the Great Blue Spot, and it is slowly drifting, dragged around by the planet's deep winds.
    claims:
      - {text: "Liquid metallic hydrogen layer generates the magnetic field", sources: [nasa_jupiter_facts]}
      - {text: "Day ~9.9 hours", sources: [nasa_jupiter_facts]}
      - {text: "Magnetic field 16 to 54 times as powerful as Earth's", sources: [nasa_jupiter_facts]}
      - {text: "Great Blue Spot; secular variation driven by deep winds", sources: [jpl_magfield_2019]}
    beats:
      - {type: video, asset: magnetosphere, from: 30, sentences: 1, label: "Jupiter's magnetosphere (NASA visualization)"}
      - {type: r3d, shot: orbit, params: {dist: [3.0, 2.8], az: [0.3, 0.2], light: [55, 15], spin: [0.0, 1.2]}, sentences: 1}
      - {type: fact, big: "16–54×", small: "the strength of Earth's magnetic field", source: nasa_jupiter_facts, sentences: 1}
      - {type: video, asset: magnetosphere, from: 50, sentences: 1}
      - {type: video, asset: mag_tour, from: 20, zoom: 1.5, sentences: 2, label: "Juno's map of Jupiter's magnetic field"}

  - id: core
    chapter: "The heart"
    narration: >
      And at the very centre? For decades, the diagrams showed a compact ball of rock and ice.
      Juno's gravity measurements found something else.
      The core looks much larger than expected, and not solid. Partly dissolved, its heavy elements smeared out into the metallic hydrogen around it.
      In some models, that fuzzy core stretches more than halfway from the centre to the cloud tops.
      How does a planet end up with a core like that? One idea is a collision.
      Early in Jupiter's history, a young planet about ten times the mass of Earth may have hit it head-on, hard enough to shatter the original core and stir it outward.
      It's a hypothesis. Nobody knows yet. But if it's right, the heart of the biggest planet in the solar system still carries the scar of a crash billions of years old.
    claims:
      - {text: "Juno: core much larger than expected, not solid, partially dissolved ('fuzzy')", sources: [nasa_jupiter_facts]}
      - {text: "Dilute core models extend as far as ~63% of the radius (uncertain)", sources: [militzer_2022]}
      - {text: "Giant-impact hypothesis: ~10 Earth-mass embryo head-on", sources: [liu_2019]}
