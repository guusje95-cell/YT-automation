scenes:
  - id: cold_open
    chapter: null
    narration: |
      MARA: Ten seconds to atmosphere.
      MARA: Velocity, one hundred and seventy thousand kilometres an hour.
      MARA: There's no ground down there, nothing to land on, just down.
      This is Mara Voss. She doesn't exist, and neither does her capsule. Nothing we know how to build would survive what happens next.
      But every number you're about to hear is real, measured by the machines that went before her.
      One of them got this far in 1995. It lasted fifty-eight minutes before the pressure silenced it.
      Mara is going to keep going. All the way to the centre.
      MARA: Here we go.
    claims:
      - {text: "Entry speed 170,590 km/h", sources: [nasa_probe]}
      - {text: "No solid surface", sources: [nasa_jupiter_facts]}
      - {text: "NASA: Jupiter's conditions crush, melt, and vaporize spacecraft trying to fly into the planet", sources: [nasa_jupiter_facts]}
      - {text: "Galileo probe, Dec 1995: data for 58 minutes; transmitter failed evidently due to the enormous pressure", sources: [nasa_probe]}
    beats:
      - {type: r3d, shot: orbit, params: {dist: [5.5, 4.2], az: [0.7, 0.55], el: [0.12, 0.1], fov: [36, 34], light: [70, 15], streak: true}, sentences: 1, pov: true,
         hud: {speed: [170590, 170590, "km/h"], status: "ATMOSPHERE IN 10 S"}}
      - {type: r3d, shot: approach, params: {dist: [6.0, 2.4], fov: [30, 42]}, sentences: 1, pov: true, hud: {speed: [170590, 170590, "km/h"], status: "FINAL APPROACH"}}
      - {type: r3d, shot: entry, params: {lon: 20, lat: 4}, sentences: 3, shake: 0.4, pov: true}
      - {type: r3d, shot: crescent, params: {dist: [3.4, 3.0], az: [0.35, 0.2], light: [105, 12]}, sentences: 3, note: ["MARA VOSS IS FICTIONAL", "EVERY NUMBER IS REAL"]}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, lightning: 0.6, seed: 4}, sentences: 1}
      - {type: image, asset: probe_painting, motion: in, crop: [0.07, 0.03, 0.92, 0.86], sentences: 1, label: "The real one: NASA's Galileo probe, 1995 (artist's impression)"}
      - {type: r3d, shot: cutaway, params: {marker: [1.0, 0.1], az: [0.35, 0.1]}, sentences: 1.4}
      - {type: r3d, shot: crescent, params: {dist: [3.3, 3.0], az: [0.35, 0.2]}, title: "Falling into Jupiter", sentences: 1.2}

  - id: entry
    chapter: "The wall of fire"
    narration: |
      MARA: Contact, contact, everything's shaking!
      MARA: The window, the window is on fire!
      At this speed, the gas in front of the capsule can't get out of the way. It piles up into a shock wave and turns into glowing plasma.
      Sixteen thousand degrees. Almost three times hotter than the surface of the Sun.
      Then the braking hits. For a few seconds, Mara weighs two hundred and twenty-eight times her normal weight. More than fifteen tonnes.
      No human could survive that. The real probe did. It was built to.
      MARA: I'm still here. I think I blacked out.
      MARA: The parachute is open.
    claims:
      - {text: "Temperatures reached 16,000 C about a minute after entry", sources: [nasa_probe]}
      - {text: "Sun's surface ~5,500 C: 16,000 is ~2.9x (derived)", sources: [nasa_sun_facts]}
      - {text: "Maximum deceleration 228 g; 228 x ~70 kg ≈ 16 t (derived)", sources: [nasa_probe]}
      - {text: "Probe descended by parachute", sources: [nasa_probe]}
    beats:
      - {type: r3d, shot: entry, params: {lon: 40, lat: -14, sustain: true}, sentences: 2, shake: 1.0, pov: true, hud: {speed: [170590, 120000, "km/h"], status: "CONTACT"}}
      - {type: r3d, shot: entry, params: {}, sentences: 1, shake: 0.7, hud: {temp: [2000, 16000, "°C"], status: "PEAK HEATING"}}
      - {type: fact, big: "16,000 °C", small: "almost three times the surface of the Sun", source: nasa_probe, sentences: 1}
      - {type: r3d, shot: entry, params: {lon: 60, lat: 10, sustain: true}, sentences: 1, shake: 1.2, pov: true, hud: {g: [40, 228, "g"], status: "MAX DECELERATION"}}
      - {type: image, asset: probe_hardware, motion: in, crop: [0.1, 0.05, 0.95, 0.9], sentences: 1, label: "The real Galileo probe, 1984: built to survive 228 g"}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, seed: 17}, sentences: 1, pov: true, hud: {speed: [400, 100, "km/h"], status: "SIGNAL OK"}}
      - {type: image, asset: probe_painting2, motion: out, crop: [0.04, 0.12, 0.96, 0.96], sentences: 1, hud: {status: "PARACHUTE DEPLOYED"}}

  - id: clouds
    chapter: "Into the storm"
    narration: |
      MARA: I'm at the cloud tops, and it's minus one hundred and sixty outside. Everything is white.
      She's falling through the top of Jupiter's weather: three layers of cloud, stacked about seventy-one kilometres deep. Ammonia ice on top. Ammonium hydrosulfide below it. And at the bottom, water.
      MARA: Something's flashing beneath me, it's lightning, and it's enormous.
      Jupiter's water clouds make lightning. And Juno spotted something even stranger: hail made of ammonia and water slush, falling out of the storms. Scientists call them mushballs.
      MARA: Wind just hit us sideways. I'm reading six hundred and forty metres per second.
      That's what the real probe measured. Almost twice the speed of sound on Earth.
      MARA: It's getting darker, and warmer.
    claims:
      - {text: "0.1 bar: -161 C", sources: [nssdc_jupiter]}
      - {text: "Three cloud layers ~71 km; ammonia ice top, ammonium hydrosulfide middle, water innermost", sources: [nasa_jupiter_facts]}
      - {text: "Water-cloud lightning, shallow lightning, mushballs", sources: [jpl_mushballs_2020]}
      - {text: "Probe measured winds up to ~640 m/s; speed of sound in Earth air ~343 m/s (derived ~1.9x)", sources: [nasa_probe]}
      - {text: "Temperature rises below the cloud tops (-108 C at 1 bar, ~150 C at 22 bar)", sources: [nssdc_jupiter, macmillan_galileo]}
    beats:
      - {type: r3d, shot: cloud_dive, params: {decks: 1, seed: 11}, sentences: 1, pov: true, hud: {temp: [-161, -150, "°C"], pressure: [0.1, 0.3, "bar"], status: "CLOUD TOPS"}}
      - {type: profile, sentences: 1}
      - {type: image, asset: belts, motion: pan_right, fit: contain, sentences: 0.6, label: "Ammonia-ice clouds (JunoCam)"}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, lightning: 2.5, seed: 21, layers: [["dive_tkachenko.jpg", [0.0, 0.0, 1.0, 0.75]], ["detail_swift.jpg", [0.0, 0.0, 0.8, 0.75]]]}, sentences: 1, pov: true, shake: 0.3, hud: {status: "LIGHTNING"}}
      - {type: image, asset: lightning_art, motion: up, sentences: 0.7, label: "Lightning on Jupiter (illustration from Juno data)"}
      - {type: image, asset: mushball_diagram, motion: in, fit: contain, sentences: 0.8, label: "'Mushballs': ammonia-water hail (NASA/JPL)"}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, seed: 25, layers: [["detail_swift.jpg", [0.0, 0.0, 0.8, 0.75]], ["dive_tkachenko.jpg", [0.0, 0.3, 1.0, 1.0]]]}, sentences: 1, shake: 0.8, pov: true, hud: {speed: [640, 640, "m/s"], status: "WIND SHEAR"}}
      - {type: fact, big: "640 m/s", small: "wind measured by the real probe", source: nasa_probe, sentences: 1}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, seed: 31, layers: [["detail_swift.jpg", [0.0, 0.0, 0.8, 0.75]], ["dive_tkachenko.jpg", [0.0, 0.3, 1.0, 1.0]]], depth_tint: [[0.8, 0.6, 0.45], [0.45, 0.3, 0.2]]}, sentences: 1, pov: true, hud: {temp: [-20, 60, "°C"], depth: [90, 140, "km"], status: "DESCENDING"}}

  - id: galileo
    chapter: "Where the probe died"
    narration: |
      About an hour after entry, Mara reaches a very special place.
      In 1995, NASA's Galileo probe stopped transmitting right here. About a hundred and eighty kilometres down. Twenty-two times the pressure of Earth's air. Around a hundred and fifty degrees, hotter than boiling water.
      Its last signal came from this depth. Then, silence.
      MARA: Passing the depth where Galileo went silent.
      MARA: There's nothing here, just dark.
      MARA: From now on, nobody has ever seen this, and I'm the first person to see it.
      Below this point, everything we know comes from the outside. From Juno, a spacecraft that has been looping around Jupiter since 2016, weighing the planet with gravity and listening to it in microwaves.
    claims:
      - {text: "Galileo: data 58 min, transmitter failed at 61.4 min, ~180 km below entry, 22.7 atm (1995)", sources: [nasa_probe]}
      - {text: "Temperature ~152-153 C at the deepest point", sources: [macmillan_galileo]}
      - {text: "Juno in polar orbit since 2016; gravity, magnetic, microwave measurements", sources: [nasa_juno]}
    beats:
      - {type: r3d, shot: cutaway, params: {marker: [1.0, 0.997], az: [0.1, 0.0], target: [[0.0, -0.05, 0.0], [0.78, 0.08, 0.59]], dist: [2.8, 0.6], fov: [36, 32]}, sentences: 1, label: "Every mission so far: the thin line at the very edge"}
      - {type: image, asset: probe_painting2, motion: in, crop: [0.04, 0.12, 0.96, 0.96], sentences: 1, hud: {clock: ["T+57:30", "T+58:00"], depth: [170, 180, "km"], pressure: [21, 22.7, "bar"], temp: [140, 153, "°C"], status: "GALILEO PROBE · 1995"}}
      - {type: glitch, text: "SIGNAL LOST", sub: "GALILEO PROBE · 7 DEC 1995 · T+61.4 MIN", sentences: 1}
      - {type: black, sentences: 0.6}
      - {type: r3d, shot: fluid, params: {mode: liquid, darker: true, seed: 3}, sentences: 1.4, pov: true, hud: {depth: [180, 185, "km"], status: "BEYOND GALILEO"}}
      - {type: r3d, shot: fluid, params: {mode: liquid, darker: true, seed: 6}, sentences: 1, note: ["FROM HERE ON", "NO MACHINE HAS EVER GONE"]}
      - {type: image, asset: juno_art, motion: in, sentences: 0.6, label: "Juno (artist's concept)"}
      - {type: r3d, shot: polar_orbit, params: {}, sentences: 0.7}

  - id: juno
    chapter: "Storms with roots"
    narration: |
      MARA: I'm two hundred kilometres down, and the wind still hasn't stopped.
      It won't for a long time. Juno found that Jupiter's famous stripes are jet streams that reach about three thousand kilometres deep.
      And the Great Red Spot, a storm twice as wide as Earth, has roots about five hundred kilometres down. Galileo's entire journey would fit inside it almost three times.
    claims:
      - {text: "Jet streams extend ~3,000 km below the cloud tops", sources: [nasa_juno]}
      - {text: "GRS twice as wide as Earth; depth ~500 km (gravity)", sources: [nasa_jupiter_facts, jpl_3d_2021]}
      - {text: "500 km / 180 km ≈ 2.8 (derived)", sources: [nasa_probe, jpl_3d_2021]}
    beats:
      - {type: r3d, shot: fluid, params: {mode: liquid, seed: 12}, sentences: 1, pov: true, shake: 0.4, hud: {depth: [195, 200, "km"], status: "WIND STILL RISING"}}
      - {type: r3d, shot: orbit, params: {dist: [2.15, 1.75], az: [0.25, 0.15], el: [-0.24, -0.32], light: [55, 15], spin: [0.7, 1.05], fov: [38, 36]}, sentences: 0.6}
      - {type: r3d, shot: cutaway, params: {layers: [[1.0, [0.95, 0.72, 0.45], [0.9, 0.62, 0.38]], [0.957, [0.62, 0.45, 0.32], [0.5, 0.36, 0.26]], [0.8, [0.36, 0.42, 0.70], [0.28, 0.33, 0.62]], [0.55, [0.95, 0.60, 0.28], [1.0, 0.86, 0.58]]], az: [0.3, 0.2], target: [[0.0, 0.0, 0.0], [0.0, 0.85, 0.1]], dist: [3.0, 0.7], el: [0.3, 0.35]},
         sentences: 0.8, label: "Jet streams reach ~3,000 km down"}
      - {type: image, asset: grs_closeup, motion: in, sentences: 0.6, label: "The Great Red Spot (JunoCam)"}
      - {type: image, asset: grs_size, motion: in, fit: contain, sentences: 0.8, label: "Its roots: about 500 km deep"}

  - id: ocean
    chapter: "The ocean with no surface"
    narration: |
      MARA: Pressure's climbing too fast. The hull is groaning.
      MARA: Wait, the outside looks thick and heavy, like we're under water.
      There's no splash. No surface. Hydrogen, almost ninety percent of Jupiter, is squeezed so hard that it slowly turns from a gas into a liquid.
      Mara isn't falling anymore. She's sinking.
      MARA: I'm in an ocean. An ocean bigger than Earth.
      Roughly halfway to the centre, the pressure gets so extreme that it rips electrons off the hydrogen atoms. The ocean starts to conduct electricity, like liquid metal.
      MARA: Every compass on board is spinning. There's current everywhere.
      This metal ocean, churning inside a planet that spins once every ten hours, is a giant dynamo. It powers a magnetic field up to fifty-four times stronger than Earth's, the same field that traps the intense radiation the real probe had to fly through on its way in.
    claims:
      - {text: "Hydrogen ~89.8% by volume", sources: [nssdc_jupiter]}
      - {text: "Pressure compresses hydrogen gas into a liquid; no clear surface", sources: [nasa_jupiter_facts]}
      - {text: "About halfway to the centre electrons are squeezed off; liquid conducts like metal; dynamo", sources: [nasa_jupiter_facts]}
      - {text: "Day 9.9 hours; field 16-54x Earth's", sources: [nasa_jupiter_facts]}
      - {text: "Probe flew through an intense radiation belt ~50,000 km above the clouds", sources: [nasa_probe]}
    beats:
      - {type: r3d, shot: fluid, params: {mode: liquid, seed: 14}, sentences: 1, pov: true, shake: 0.6, hud: {depth: [1000, 3000, "km"], status: "HULL STRESS"}}
      - {type: r3d, shot: fluid, params: {mode: liquid, seed: 5}, sentences: 1, pov: true, hud: {depth: [3000, 6000, "km"], status: "DENSITY RISING"}}
      - {type: r3d, shot: cutaway, params: {marker: [0.96, 0.85], az: [0.2, 0.05], target: [[0.7, 0.08, 0.5], [0.0, -0.05, 0.0]], dist: [1.1, 2.7]}, sentences: 1, label: "Gas becomes liquid: no surface, no splash"}
      - {type: r3d, shot: fluid, params: {mode: liquid, darker: true, seed: 8}, sentences: 2, pov: true, hud: {depth: [6000, 15000, "km"], status: "SUBMERGED"}}
      - {type: r3d, shot: cutaway, params: {marker: [0.85, 0.52], az: [0.05, -0.1]}, sentences: 1, label: "Halfway down: hydrogen turns metallic"}
      - {type: r3d, shot: fluid, params: {mode: metallic}, sentences: 1, pov: true, shake: 0.3, hud: {depth: [33000, 35000, "km"], status: "CONDUCTIVE MEDIUM"}}
      - {type: video, asset: magnetosphere, from: 30, sentences: 0.7, label: "Jupiter's magnetic field (NASA visualization)"}
      - {type: video, asset: mag_tour, from: 20, zoom: 1.5, sentences: 0.6, label: "Juno's map of the field"}

  - id: core
    chapter: "The heart"
    narration: |
      MARA: I've lost the link to the orbiter. Recording anyway.
      For decades, textbooks drew a small, solid rock at Jupiter's centre. Juno's gravity measurements say that picture is wrong.
      The core is huge, and fuzzy. Partly dissolved into the metal around it. In some models, it stretches more than halfway to the cloud tops.
      One explanation: when Jupiter was young, a planet about ten times the mass of Earth may have hit it head-on, shattering its core so badly that it never settled again.
      MARA: There's no floor and no rock, it just gets denser and hotter.
      Near the centre, scientists estimate the temperature at around twenty-four thousand degrees. More than four times hotter than the surface of the Sun.
      MARA: This is Vesper, final log. If anyone ever hears this, it was beautiful.
    claims:
      - {text: "Core much larger than expected, not solid, partially dissolved (fuzzy)", sources: [nasa_jupiter_facts]}
      - {text: "Dilute core may extend to ~63% of the radius", sources: [militzer_2022]}
      - {text: "Giant impact hypothesis (~10 Earth masses, head-on)", sources: [liu_2019]}
      - {text: "Estimated ~24,000 C near the centre (model estimate)", sources: [nasa_spaceplace]}
      - {text: "24,000 / 5,500 ≈ 4.4 (derived)", sources: [nasa_sun_facts]}
    beats:
