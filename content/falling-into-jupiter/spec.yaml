scenes:
  - id: cold_open
    chapter: null
    narration: |
      [hushed]: In 1995, NASA dropped a machine into Jupiter.
      [hushed]: It lasted fifty-eight minutes before the planet silenced it.
      [dramatic]: And what it sent back made no sense. The air was bone dry. And something down there had stolen the neon.
      [hushed]: Nothing has gone deeper since. Until her.
      MARA[tense]: Vesper to relay, entry in ten seconds.
      MARA[calm]: Noor, sweetheart, if you're watching this, I'll be home before your birthday. I promise.
      [hushed]: These are the recordings she sent back.
    claims:
      - {text: "Galileo probe entered Jupiter Dec 1995; 58 minutes of data; transmitter failed due to the enormous pressure", sources: [nasa_probe]}
      - {text: "Probe found far less water than expected (entered an unusually dry spot)", sources: [nasa_probe, jpl_water_2020]}
      - {text: "Neon one-tenth as abundant as in the Sun", sources: [berkeley_helium]}
      - {text: "No spacecraft has since gone deeper (Juno measures from orbit)", sources: [nasa_juno]}
    beats:
      - {type: r3d, shot: orbit, params: {dist: [3.6, 3.1], az: [0.7, 0.55], el: [0.12, 0.1], fov: [36, 34], light: [70, 15], streak: true}, sentences: 2,
         note: ["BASED ON A TRUE STORY"], note_big: true}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, lightning: 0.6, seed: 4}, sentences: 1, hud: {clock: ["T+00:00", "T+58:00"], status: "GALILEO PROBE · 1995", mission: "GALILEO PROBE  ·  TELEMETRY"}}
      - {type: glitch, text: "SIGNAL LOST", sentences: 0.7}
      - {type: image, asset: entry_site, motion: in, fit: contain, crop: [0.0, 0.0, 1.0, 0.86], sentences: 1.3, label: "The probe's entry site, imaged by Hubble"}
      - {type: r3d, shot: crescent, params: {dist: [3.4, 3.0], az: [0.35, 0.2], light: [85, 14]}, sentences: 2}
      - {type: r3d, shot: approach, params: {dist: [4.0, 2.2], fov: [30, 42]}, sentences: 1, pov: true, heartbeat: 0.5,
         hud: {hull: [100, 100, "%"], speed: [170590, 170590, "km/h"], status: "ENTRY IN 10 S"}}
      - {type: r3d, shot: approach, params: {dist: [2.4, 1.9], fov: [40, 46], az: [0.2, 0.1]}, sentences: 2, pov: true, heartbeat: 0.5,
         hud: {hull: [100, 100, "%"], speed: [170590, 170590, "km/h"], status: "PERSONAL CHANNEL"}}
      - {type: r3d, shot: crescent, params: {dist: [3.3, 3.0], az: [0.35, 0.2]}, title: "Falling into Jupiter", sentences: 1.2}

  - id: entry
    chapter: "The wall of fire"
    narration: |
      How do you survive hitting a planet at a hundred and seventy thousand kilometres an hour?
      The real probe did it with brute force. A heat shield designed to burn away as it fell, and braking so violent it felt two hundred and twenty-eight times its own weight.
      A human can't take that. In 1954, a test pilot survived about forty-six g, and it nearly blinded him.
      So Mara's capsule cheats. It skims the edge of the atmosphere at a shallow angle, braking for minutes instead of seconds.
      MARA[panic]: Contact! The shield is burning, there's fire on every window!
      MARA[panic]: Six g, seven, eight, I can't breathe, I can't...
      [dramatic]: Outside, the gas turns to plasma. Sixteen thousand degrees. Almost three times hotter than the surface of the Sun.
      MARA[weak]: Still here. I'm still here. The parachute is out.
      [hushed]: Mara has survived the easy part.
    claims:
      - {text: "Probe: carbon phenolic heat shield ablated during entry; max deceleration 228 g", sources: [nasa_probe, ntrs_entry]}
      - {text: "Stapp, 10 Dec 1954: 46.2 g; eyes badly affected", sources: [smithsonian_stapp]}
      - {text: "16,000 C plasma; Sun's surface ~5,500 C (derived ~2.9x)", sources: [nasa_probe, nasa_sun_facts]}
      - {text: "Probe descended by parachute", sources: [nasa_probe]}
    beats:
      - {type: r3d, shot: entry, params: {lon: 20, lat: 4}, sentences: 1, pov: true, shake: 0.3}
      - {type: image, asset: probe_hardware, motion: in, crop: [0.1, 0.05, 0.95, 0.9], sentences: 1.4, label: "The real probe, 1984: built to survive 228 g"}
      - {type: fact, big: "46 g", small: "the most a test pilot survived, 1954", source: smithsonian_stapp, sentences: 1}
      - {type: r3d, shot: orbit, params: {dist: [2.4, 2.0], az: [0.3, 0.1], el: [0.02, 0.0], light: [70, 12], streak: true}, sentences: 1.6}
      - {type: r3d, shot: entry, params: {lon: 40, lat: -14, sustain: true}, sentences: 1, shake: 1.2, pov: true, heartbeat: 1.0,
         hud: {hull: [100, 91, "%"], speed: [170590, 120000, "km/h"], status: "CONTACT"}}
      - {type: r3d, shot: entry, params: {lon: 60, lat: 10, sustain: true}, sentences: 1, shake: 1.5, pov: true, heartbeat: 1.0,
         hud: {hull: [91, 84, "%"], g: [6, 8.4, "g"], status: "MAX DECELERATION"}}
      - {type: r3d, shot: entry, params: {}, sentences: 1, shake: 0.6, hud: {temp: [9000, 16000, "°C"], status: "PEAK HEATING"}}
      - {type: fact, big: "16,000 °C", small: "almost three times the surface of the Sun", source: nasa_probe, sentences: 1}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, seed: 17}, sentences: 1, pov: true, hud: {hull: [84, 84, "%"], status: "PARACHUTE DEPLOYED"}}
      - {type: black, ember: false, sentences: 0.4}

  - id: clouds
    chapter: "The storm"
    narration: |
      MARA[awe]: Noor, you should see this. Clouds of ice, like snow that never lands.
      She's falling through Jupiter's weather. Three decks of cloud, stacked about seventy-one kilometres deep. Ammonia ice on top, then ammonium hydrosulfide, then water.
      MARA[tense]: Something's flashing below me. It's lightning, and it's lighting up the whole deck.
      Juno watched these storms throw out hail made of ammonia and water slush. Scientists call them mushballs.
      MARA[panic]: Wind! Hold on, hold on! Six hundred and forty metres per second!
      That's what the real probe measured. Almost twice the speed of sound.
      [dramatic]: And then, Mara's instruments find the first clue.
      MARA[tense]: Humidity is dropping. It's dry down here, completely dry.
      The real probe found the same thing in 1995. Almost no water, in a planet that should be full of it.
      For years it was a puzzle. The answer turned out to be bad luck. The probe had fallen into a rare desert in the sky, a hot spot where dry air sinks.
      [hushed]: But the missing neon? That clue is still waiting, thousands of kilometres further down.
    claims:
      - {text: "Three cloud layers ~71 km: ammonia ice, ammonium hydrosulfide, water", sources: [nasa_jupiter_facts]}
      - {text: "Lightning in water clouds; mushballs (ammonia-water hail)", sources: [jpl_mushballs_2020]}
      - {text: "Probe measured winds up to ~640 m/s; speed of sound in air ~343 m/s (derived ~1.9x)", sources: [nasa_probe]}
      - {text: "Probe (1995) found less water; entered a dry 5-micron hot spot (unusual downdraft site)", sources: [nasa_probe, jpl_water_2020, li_water_2020]}
      - {text: "Neon depletion explained by helium rain thousands of km deeper", sources: [berkeley_helium]}
    beats:
      - {type: r3d, shot: cloud_dive, params: {decks: 1, seed: 11}, sentences: 2, pov: true, hud: {hull: [84, 84, "%"], temp: [-161, -150, "°C"], pressure: [0.1, 0.3, "bar"], status: "CLOUD TOPS"}}
      - {type: profile, sentences: 2}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, lightning: 2.5, seed: 21, layers: [["dive_tkachenko.jpg", [0.0, 0.0, 1.0, 0.75]], ["detail_swift.jpg", [0.0, 0.0, 0.8, 0.75]]]}, sentences: 1, pov: true, shake: 0.3, hud: {status: "LIGHTNING"}}
      - {type: image, asset: lightning_art, motion: up, sentences: 0.7, label: "Lightning on Jupiter (illustration from Juno data)"}
      - {type: image, asset: mushball_diagram, motion: in, fit: contain, sentences: 1, label: "'Mushballs': ammonia-water hail (NASA/JPL)"}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, seed: 25, layers: [["detail_swift.jpg", [0.0, 0.0, 0.8, 0.75]], ["dive_tkachenko.jpg", [0.0, 0.3, 1.0, 1.0]]]}, sentences: 1, shake: 1.2, pov: true, heartbeat: 1.0,
         hud: {hull: [84, 77, "%"], speed: [640, 640, "m/s"], status: "WIND SHEAR"}}
      - {type: fact, big: "640 m/s", small: "wind measured by the real probe", source: nasa_probe, sentences: 1}
      - {type: r3d, shot: cloud_dive, params: {decks: 1, seed: 31, layers: [["detail_swift.jpg", [0.0, 0.0, 0.8, 0.75]], ["dive_tkachenko.jpg", [0.0, 0.3, 1.0, 1.0]]], depth_tint: [[0.8, 0.6, 0.45], [0.45, 0.3, 0.2]]}, sentences: 2, pov: true,
         hud: {hull: [77, 77, "%"], status: "HUMIDITY 0.0"}}
      - {type: image, asset: entry_site, motion: in, fit: contain, crop: [0.0, 0.0, 1.0, 0.86], sentences: 1, label: "Where the real probe fell: a dry 'hot spot'"}
      - {type: image, asset: belts, motion: pan_right, fit: contain, sentences: 2, label: "Jupiter's belts and zones (JunoCam)"}
      - {type: r3d, shot: fluid, params: {mode: liquid, rain: 0.6, darker: true, seed: 40}, sentences: 1}

  - id: galileo
    chapter: "The grave"
    narration: |
      About an hour after entry, Mara reaches a place no one has ever passed.
      In 1995, the Galileo probe went silent right here. A hundred and eighty kilometres down. Twenty-two times the pressure of Earth's air. Hotter than boiling water.
      MARA[weak]: Passing the depth where Galileo died. I wanted to say something.
      MARA[awe]: Thank you. You showed us the way down.
      MARA[tense]: From now on, nobody has ever seen this, and I'm the first person to see it.
      Below this point, everything we know comes from the outside. From Juno, circling the planet since 2016, weighing it with gravity and listening to it in microwaves.
    claims:
      - {text: "Galileo transmitter failed ~180 km below entry, 22.7 atm, ~152 C (1995)", sources: [nasa_probe, macmillan_galileo]}
      - {text: "Juno since 2016: gravity, magnetic and microwave measurements", sources: [nasa_juno]}
    beats:
      - {type: r3d, shot: cutaway, params: {marker: [1.0, 0.997], az: [0.1, 0.0], target: [[0.0, -0.05, 0.0], [0.78, 0.08, 0.59]], dist: [2.8, 0.6], fov: [36, 32]}, sentences: 1, label: "Every mission so far: the thin line at the very edge"}
      - {type: image, asset: probe_painting, motion: in, crop: [0.13, 0.03, 0.93, 0.86], sentences: 1.5, hud: {clock: ["T+57:30", "T+58:00"], depth: [170, 180, "km"], pressure: [21, 22.7, "bar"], status: "GALILEO PROBE · 1995", mission: "GALILEO PROBE  ·  TELEMETRY"}}
      - {type: glitch, text: "SIGNAL LOST", sub: "GALILEO PROBE · 7 DEC 1995 · T+61.4 MIN", sentences: 1}
      - {type: r3d, shot: fluid, params: {mode: liquid, darker: true, seed: 3}, sentences: 2, pov: true, hud: {hull: [77, 76, "%"], depth: [180, 181, "km"], status: "BEYOND GALILEO"}}
      - {type: r3d, shot: fluid, params: {mode: liquid, darker: true, seed: 6}, sentences: 1, note: ["FROM HERE ON", "NO MACHINE HAS EVER GONE"]}
      - {type: image, asset: juno_art, motion: in, sentences: 0.8, label: "Juno (artist's concept)"}
      - {type: r3d, shot: polar_orbit, params: {}, sentences: 0.8}

  - id: juno
    chapter: "Storms with roots"
    narration: |
      MARA[tense]: I'm two hundred kilometres down, and the wind still hasn't stopped.
      It won't. Juno found that Jupiter's stripes are jet streams that reach about three thousand kilometres deep.
      And the Great Red Spot, a storm twice as wide as Earth, has roots about five hundred kilometres down. The probe's whole journey would fit inside it almost three times.
      [hushed]: But deeper still, something stranger is waiting.
    claims:
      - {text: "Jet streams extend ~3,000 km below the cloud tops", sources: [nasa_juno]}
      - {text: "GRS twice as wide as Earth; ~500 km deep (gravity)", sources: [nasa_jupiter_facts, jpl_3d_2021]}
      - {text: "500 km / 180 km ≈ 2.8 (derived)", sources: [nasa_probe, jpl_3d_2021]}
    beats:
      - {type: r3d, shot: fluid, params: {mode: liquid, seed: 12}, sentences: 1, pov: true, shake: 0.5, hud: {hull: [76, 74, "%"], depth: [195, 200, "km"], status: "WIND STILL RISING"}}
      - {type: r3d, shot: cutaway, params: {layers: [[1.0, [0.95, 0.72, 0.45], [0.9, 0.62, 0.38]], [0.957, [0.62, 0.45, 0.32], [0.5, 0.36, 0.26]], [0.8, [0.36, 0.42, 0.70], [0.28, 0.33, 0.62]], [0.55, [0.95, 0.60, 0.28], [1.0, 0.86, 0.58]]], az: [0.3, 0.2], target: [[0.0, 0.0, 0.0], [0.0, 0.85, 0.1]], dist: [3.0, 0.7], el: [0.3, 0.35]},
         sentences: 1.2, label: "Jet streams reach ~3,000 km down"}
      - {type: r3d, shot: orbit, params: {dist: [2.15, 1.75], az: [0.25, 0.15], el: [-0.24, -0.32], light: [55, 15], spin: [0.7, 1.05], fov: [38, 36]}, sentences: 0.8}
      - {type: image, asset: grs_size, motion: in, fit: contain, sentences: 1, label: "The Great Red Spot's roots: about 500 km"}
      - {type: r3d, shot: fluid, params: {mode: liquid, darker: true, seed: 44}, sentences: 1}

  - id: ocean
    chapter: "The ocean"
    narration: |
      MARA[panic]: Pressure warning! The hull is groaning, that's not a sound I want to hear.
      MARA[tense]: The outside looks thick and heavy, like we're under water.
      There's no splash. No surface. Hydrogen, almost ninety percent of Jupiter, is squeezed until it slowly turns from gas into liquid.
      [dramatic]: Mara isn't falling anymore. She's sinking.
      MARA[awe]: Noor, I'm in an ocean. An ocean bigger than Earth, and I'm the only one in it.
      [hushed]: Ten thousand kilometres down, the second clue appears.
      MARA[tense]: Something is falling past me. Drops, silver drops. That's not water. It's helium.
      This is our best understanding of the physics. At a million times Earth's air pressure and around five thousand degrees, helium may stop mixing with the hydrogen and fall as rain.
      And as it falls, the helium rain drags neon down with it.
      [dramatic]: Remember the stolen neon the probe found in 1995? Only a tenth of what the Sun has. This may be the thief.
    claims:
      - {text: "Hydrogen ~89.8% by volume", sources: [nssdc_jupiter]}
      - {text: "Pressure compresses hydrogen gas into a liquid; no surface", sources: [nasa_jupiter_facts]}
      - {text: "Helium droplets form ~10,000-13,000 km down at 1-2 million bar, ~5,000 C, and carry neon down; neon one-tenth solar (Galileo probe, 1995)", sources: [berkeley_helium]}
    beats:
