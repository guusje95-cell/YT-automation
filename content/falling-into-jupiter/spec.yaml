    chapter: null
    narration: |
      [hushed]: Mara's journey was imagined. The probe's was not.
      In 1995, a small machine really did fall into Jupiter, and for fifty-eight minutes it told us what it found. A desert in the sky. Missing neon. Clues we are still following today.
      Every fact about Jupiter in this story is real. Everything below that probe's grave, we've only ever seen from far outside.
