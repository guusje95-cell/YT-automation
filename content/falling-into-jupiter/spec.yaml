id: falling-into-jupiter
format: story
pillar: missions-and-discoveries
status: draft
description_summary: >
  On 7 December 1995 a small NASA probe plunged into Jupiter at 170,000 km/h and sent data for 58 minutes before it
  died. We follow it down through the clouds, then keep going with NASA's Juno data, past an ocean of liquid metal to a
  core nobody expected. Real mission data, every number sourced below.
title_options:
  - "Falling Into Jupiter"
  - "A Probe Fell Into Jupiter. Here's What It Found Before It Died."
  - "What's Really Inside Jupiter (We Sent Something In)"
