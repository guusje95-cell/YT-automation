id: falling-into-jupiter
format: story
pillar: missions-and-discoveries
status: draft
description_summary: >
  Based on a true story: in 1995 NASA's Galileo probe fell into Jupiter and sent data for 58 minutes. Mara Voss and
  her capsule are a dramatization; every fact about Jupiter in this film is real. We follow her capsule from the top of Jupiter's
  atmosphere past the exact depth where NASA's Galileo probe went silent in 1995, then down through an ocean of
  liquid metal to a core nobody expected, using real data from Galileo and Juno. Sources below.
title_options:
  - "Falling Into Jupiter (Based on a True Story)"
  - "Falling Into Jupiter (Every Number Is Real)"
  - "What You'd See Falling Into Jupiter, All the Way Down"
  - "A Journey to the Centre of Jupiter (Real NASA Data)"
