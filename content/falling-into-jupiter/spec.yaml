  - id: metal
    chapter: "Liquid metal"
    narration: |
      Halfway to the centre, the pressure rips electrons off the hydrogen atoms. The ocean starts to conduct electricity, like liquid metal.
      MARA[panic]: Every compass on board is spinning! There's current everywhere!
      This churning metal ocean, inside a planet that spins once every ten hours, is a giant dynamo. It powers a magnetic field up to fifty-four times stronger than Earth's.
      MARA[tense]: Relay link is failing. I don't know if you're still getting this.
    claims:
      - {text: "About halfway to the centre, hydrogen becomes electrically conducting like metal; dynamo", sources: [nasa_jupiter_facts]}
      - {text: "Day 9.9 hours; field 16-54x Earth's", sources: [nasa_jupiter_facts]}
    beats:
      - {type: r3d, shot: cutaway, params: {marker: [0.85, 0.52], az: [0.05, -0.1]}, sentences: 2, label: "Halfway down: hydrogen turns metallic"}
      - {type: r3d, shot: fluid, params: {mode: metallic}, sentences: 1, pov: true, shake: 0.8, heartbeat: 1.0, hud: {hull: [55, 49, "%"], depth: [33000, 35000, "km"], status: "CONDUCTIVE MEDIUM"}}
      - {type: video, asset: magnetosphere, from: 30, sentences: 1, label: "Jupiter's magnetic field (NASA visualization)"}
      - {type: video, asset: mag_tour, from: 20, zoom: 1.5, sentences: 1, label: "Juno's map of the field"}
      - {type: r3d, shot: fluid, params: {mode: metallic, seed: 21}, sentences: 1, pov: true, hud: {hull: [49, 44, "%"], status: "RELAY LINK FAILING"}}

  - id: core
    chapter: "The heart"
    narration: |
      For decades, textbooks drew a small, solid rock at Jupiter's centre. Juno's gravity data says that picture is wrong.
      The core is huge and fuzzy. Partly dissolved into the metal around it, maybe stretching more than halfway to the cloud tops.
      One idea: when Jupiter was young, a planet about ten times the mass of Earth may have hit it head-on and shattered its core. It never settled again.
      MARA[weak]: There's no floor and no rock, it just keeps getting hotter.
      Near the centre, scientists estimate around twenty-four thousand degrees. More than four times hotter than the surface of the Sun.
      MARA[weak]: Noor, I'm not going to make your birthday. I'm so sorry.
      MARA[awe]: But I saw the heart of a giant, and it was beautiful.
    claims:
      - {text: "Core much larger than expected, not solid, partly dissolved", sources: [nasa_jupiter_facts]}
      - {text: "Dilute core may extend to ~63% of the radius", sources: [militzer_2022]}
      - {text: "Giant impact hypothesis (~10 Earth masses, head-on)", sources: [liu_2019]}
      - {text: "Estimated ~24,000 C near the centre; Sun surface ~5,500 C", sources: [nasa_spaceplace, nasa_sun_facts]}
    beats:
      - {type: r3d, shot: cutaway, params: {layers: [[1.0, [0.85, 0.66, 0.44], [0.62, 0.44, 0.30]], [0.80, [0.36, 0.42, 0.70], [0.28, 0.33, 0.62]], [0.12, [0.55, 0.42, 0.35], [0.45, 0.35, 0.3]]], fuzzy: false, az: [0.3, 0.15]}, sentences: 1.5, label: "The old picture: a small, solid core"}
      - {type: r3d, shot: cutaway, params: {az: [0.15, 0.0], dist: [2.8, 2.4]}, sentences: 1.5, label: "Juno: a huge, 'fuzzy' core"}
      - {type: r3d, shot: collision, params: {}, sentences: 2, label: "Hypothesis: a young planet ~10× Earth's mass (illustration)"}
      - {type: r3d, shot: fluid, params: {mode: metallic, seed: 30}, sentences: 1, pov: true, shake: 0.6, heartbeat: 0.4, hud: {hull: [44, 23, "%"], depth: [60000, 65000, "km"], status: "NO FLOOR DETECTED"}}
      - {type: fact, big: "≈24,000 °C", small: "estimated temperature near the centre", source: nasa_spaceplace, sentences: 2}
      - {type: r3d, shot: fluid, params: {mode: metallic, darker: true, seed: 33}, sentences: 2, pov: true, heartbeat: 0.2, hud: {hull: [23, 9, "%"], status: "PERSONAL CHANNEL"}}
