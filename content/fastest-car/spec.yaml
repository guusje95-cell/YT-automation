id: fastest-car
format: story
pillar: speed-records
status: draft
description_summary: >
  A true story. In October 2020 a small American company claimed its car had averaged more than 500 km/h on a
  Nevada highway. Within weeks its own video had been pulled apart. This is the 127-year fight over one title,
  the fastest car in the world, and the two rules that decide who really owns it. This November a Chinese electric
  hypercar will try to break 500 km/h. Every number in this film is sourced below.
title_options:
  - "The 500 km/h Wall: The Fastest Car Record Nobody Can Agree On"
  - "The Fastest Car in the World Is a Lie. Here's Why."
  - "Why No Car Has Officially Hit 500 km/h (Yet)"
