scenes:
  - id: cold_open
    chapter: null
    narration: |
      [hushed]: October, twenty twenty. An empty desert highway in Nevada.
      [dramatic]: A car from a small American company is about to claim a number no production car had ever officially reached. An average of more than five hundred kilometres per hour.
      The video went online, and within days the world had a new fastest car.
      [hushed]: Then people started timing that car against landmarks on the road.
      [dramatic]: What they found turned the record into one of the biggest arguments in car history.
      And this November, a Chinese electric car will try to break that same barrier, for real this time.
      [hushed]: To understand why five hundred is so hard, we have to go back to a park outside Paris, in December, eighteen ninety-eight.
    claims:
      - {text: "Oct 2020, SSC Tuatara claimed 316.11 mph (508.73 km/h) two-way average on a Nevada highway; video later admitted 'substantially incorrect'", sources: [drive_tuatara, yahoo_tuatara]}
      - {text: "BYD plans an attempt to exceed 500 km/h with the Yangwang U9 Xtreme in November 2026", sources: [cnc_u9_500]}
    beats:
      - {type: road, sky: night, speed: [0.4, 0.8], label: "Nevada · October 2020", sentences: 2, note: ["A TRUE STORY"], note_big: true}
      - {type: road, sky: dusk, speed: [0.9, 1.7], speedo: {from: 0, to: 508, unit: "km/h"}, sentences: 2, seed: 5}
      - {type: image, asset: tuatara_a, motion: in, sentences: 1, label: "SSC Tuatara"}
      - {type: landmark, claimed: "Speed on screen", sentences: 1}
      - {type: speed, start: 0, end: 508.73, label: "SSC Tuatara · October 2020", sub: "claimed two-way average", verdict: "DISPUTED", sentences: 1}
      - {type: record_chart, points: *pts, title: "The 500 km/h wall", reveal: [2016, 2026], x_range: [[2015, 2027], [2016, 2027]], y_range: [[400, 530], [420, 530]], wall: 500, focus: "Yangwang U9 Xtreme", source_label: "Sources: Guinness World Records, Racelogic, BYD", sentences: 1}
      - {type: title, style: cinematic, text: "ACHÈRES · 1898", sub: "A park outside Paris", sentences: 1}

  - id: never_satisfied
    chapter: "Never satisfied"
    narration: |
      A French car magazine organises a timed run through the park at Achères.
      The winner is a count, Gaston de Chasseloup-Laubat, in an electric car, at sixty-three kilometres per hour. The first recognised land speed record.
      A Belgian racer, Camille Jenatzy, takes that personally.
      Over the next four months, the two men take the record from each other again and again.
      [dramatic]: Then Jenatzy builds something new. A torpedo-shaped electric car he calls La Jamais Contente. The never satisfied.
      On the twenty-ninth of April, eighteen ninety-nine, it becomes the first car ever to go faster than one hundred kilometres per hour.
      [hushed]: The first car to break a hundred was electric. Remember that, because it matters at the end of this story.
    claims:
      - {text: "18 Dec 1898, Achères: Chasseloup-Laubat, Jeantaud electric, 63.13 km/h, first recognised land speed record; competition organised by La France Automobile", sources: [wiki_chasseloup, wiki_lsr]}
      - {text: "Record duels Jan to Apr 1899: 66.66 / 70.31 (17 Jan), 80.35 (27 Jan), 92.78 (4 Mar)", sources: [wiki_lsr, wapling_acheres]}
      - {text: "29 Apr 1899: La Jamais Contente, 105.882 km/h, first over 100 km/h; electric, torpedo-shaped body", sources: [wiki_jamais]}
    beats:
      - {type: record_chart, points: *pts, title: "Land speed record", reveal: [1898.8, 1899.0], x_range: [[1898.8, 1899.5], [1898.8, 1899.5]], y_range: [[0, 120], [0, 120]], source_label: "Source: Wikipedia, List of land speed records", sentences: 3}
      - {type: image, asset: jenatzy, motion: in, crop: [0.025, 0.04, 0.985, 0.935], focus: [0.4, 0.4], sentences: 1, label: "Camille Jenatzy (at a later race)"}
      - {type: record_chart, points: *pts, title: "Land speed record", reveal: [1899.0, 1899.25], x_range: [[1898.8, 1899.5], [1898.8, 1899.5]], y_range: [[0, 120], [0, 120]], source_label: "Source: Wikipedia, List of land speed records", sentences: 1}
      - {type: image, asset: jamais_a, motion: in, sentences: 1.5, label: "La Jamais Contente, 1899"}
      - {type: image, asset: jamais_b, motion: pan_right, sentences: 1.5}
      - {type: speed, start: 0, end: 105.88, decimals: 1, label: "La Jamais Contente · 29 April 1899", sub: "first car over 100 km/h", sentences: 1}
      - {type: image, asset: jamais_c, motion: out, sentences: 2, label: "La Jamais Contente: battery-electric"}

  - id: rules
    chapter: "The two rules"
    narration: |
      For the next century, the fastest machines on land stopped being cars you could buy.
      In nineteen ninety-seven, a British car called Thrust SSC, pushed by two jet engines, broke the sound barrier in the Nevada desert, at more than twelve hundred kilometres per hour.
      Its driver, a Royal Air Force fighter pilot, is still the only person to have gone supersonic on land.
      [dramatic]: But nobody can buy a jet car. So a second race began: the fastest car you can actually buy.
      And that race has two rules that decide everything in this story.
      Rule one: two runs, in opposite directions, and the record is the average. That cancels out wind and slope.
      Rule two: the record car has to be the same as the cars sold to customers.
      [hushed]: Keep those two rules in mind. Almost every fight that follows breaks one of them.
    claims:
      - {text: "ThrustSSC, 15 Oct 1997, Black Rock Desert, 1,227.985 km/h (763.035 mph), two Rolls-Royce Spey jet engines; Andy Green, RAF pilot, only person to break the sound barrier on land", sources: [gwr_thrust]}
      - {text: "Record = average of two runs (opposite directions) within an hour", sources: [gwr_lsr_1997, gtplanet_chiron]}
      - {text: "Guinness production-car rule: record car must be mechanically identical to those sold", sources: [driving_veyron_strip]}
    beats:
      - {type: image, asset: thrust_fin, motion: in, sentences: 1, label: "ThrustSSC"}
      - {type: speed, start: 0, end: 1228, label: "ThrustSSC · 15 October 1997", sub: "Black Rock Desert, Nevada · supersonic", sentences: 1}
      - {type: image, asset: thrust_helmet, motion: in, sentences: 1, label: "Andy Green's helmet"}
      - {type: road, sky: day, speed: [0.7, 1.1], sentences: 2, seed: 9}
      - {type: fact_list, title: "The two rules", items: ["Two runs, opposite directions, averaged", "The same car customers can buy"], source: gwr_lsr_1997, sentences: 4}
      - {type: record_chart, points: *overview, title: "The fastest car you can buy", reveal: [1990, 2026], x_range: [[1990, 2027], [1990, 2027]], y_range: [[300, 520], [300, 520]], wall: 500, source_label: "Sources: Guinness World Records, Racelogic, BYD", sentences: 2}

  - id: limiter
    chapter: "The limiter"
    narration: |
      In nineteen ninety-eight, a driver named Andy Wallace takes a McLaren F1 to a Volkswagen test track in northern Germany. Three hundred and eighty-six kilometres per hour.
      The record stands for years. Then Bugatti arrives with the Veyron, and in twenty ten its Super Sport version averages four hundred and thirty-one.
      [dramatic]: In twenty thirteen, Guinness takes that record away.
      The reason was the speed limiter. On the record car it had been switched off, but on the cars sold to customers it was switched on. That broke rule two.
      Bugatti pushes back. One week later, after an outside expert review, Guinness gives the record back. A limiter, it decides, does not change what the car is.
      [hushed]: The lesson was clear. The rules could bend.
    claims:
      - {text: "31 Mar 1998, McLaren F1 XP5, Andy Wallace, Ehra-Lessien, 240.1 mph (386.4 km/h); stood until the Veyron", sources: [carscoops_f1]}
      - {text: "Veyron Super Sport, July 2010, 431.07 km/h (267.86 mph)", sources: [driving_veyron_strip, hagerty_agera]}
      - {text: "April 2013: Guinness withdrew the record (limiter deactivated on the record car), then reinstated it a week later after an external expert review", sources: [driving_veyron_strip, ma_veyron_back]}
    beats:
      - {type: image, asset: mclaren, motion: in, sentences: 1.5, label: "McLaren F1"}
      - {type: record_chart, points: *pts, title: "The fastest car you can buy", reveal: [1997, 2011], x_range: [[1995, 2013], [1995, 2013]], y_range: [[350, 460], [350, 460]], source_label: "Sources: Carscoops, Guinness World Records", sentences: 1.5}
      - {type: image, asset: veyron_ss, motion: in, sentences: 1, label: "Bugatti Veyron Super Sport"}
      - {type: glitch, text: "RECORD WITHDRAWN", sub: "GUINNESS WORLD RECORDS · 2013", sentences: 1}
      - {type: fact_list, title: "Why", items: ["Record car: limiter off", "Customer cars: limiter on"], source: driving_veyron_strip, sentences: 3}
      - {type: fact, big: "1 week", small: "until Guinness gave the record back", source: ma_veyron_back, sentences: 2}
      - {type: image, asset: veyron_ss, motion: out, focus: [0.6, 0.5], sentences: 3}

  - id: highway
    chapter: "The highway"
    narration: |
      November, twenty seventeen. Koenigsegg does something no one had tried. It closes a public highway.
      A stretch of Nevada State Route one sixty, outside the town of Pahrump.
      A customer's Agera RS runs in both directions. Four hundred and forty-seven kilometres per hour, averaged. A new world record.
      Two years later, Bugatti goes faster. A Chiron Super Sport prototype hits four hundred and ninety, at that same German test track.
      The driver is Andy Wallace, again, twenty-one years after the McLaren.
      [dramatic]: But Bugatti only drives in one direction, so it breaks rule one. It is the fastest speed a road car had ever reached, and it is not an official record.
      [hushed]: Five hundred was now just ten kilometres per hour away. Someone was going to claim it.
    claims:
      - {text: "4 Nov 2017, Agera RS (customer car), closed Nevada SR 160 near Pahrump, 277.87 mph (447.19 km/h) two-way average, Guinness record", sources: [hagerty_agera]}
      - {text: "2 Aug 2019, Chiron Super Sport 300+ pre-production prototype, Andy Wallace, Ehra-Lessien, 304.773 mph (490.48 km/h), one direction only, not an official record", sources: [gtplanet_chiron]}
    beats:
      - {type: image, asset: agera, motion: in, sentences: 3, label: "Koenigsegg Agera RS"}
      - {type: road, sky: day, speed: [0.8, 1.3], label: "Nevada State Route 160", sentences: 1, seed: 11}
      - {type: speed, start: 0, end: 447.19, label: "Koenigsegg Agera RS · 4 November 2017", sub: "two-way average · world record", sentences: 3}
      - {type: image, asset: chiron_ss, motion: in, sentences: 2, label: "Bugatti Chiron Super Sport"}
      - {type: image, asset: mclaren, motion: out, focus: [0.5, 0.6], sentences: 1, label: "McLaren F1, 1998: also Andy Wallace"}
      - {type: speed, start: 0, end: 490.48, label: "Chiron Super Sport 300+ prototype · 2019", sub: "one direction only", verdict: "NOT A RECORD", sentences: 2}
      - {type: record_chart, points: *pts, title: "The 500 km/h wall", reveal: [2016, 2019.8], x_range: [[2015, 2022], [2015, 2022]], y_range: [[400, 530], [420, 530]], wall: 500, focus: "Chiron SS 300+", source_label: "Sources: Hagerty, GTPlanet", sentences: 2}

  - id: video
    chapter: "The video"
    narration: |
      That someone was SSC, a small American carmaker.
      In October twenty twenty, its Tuatara runs on that same Nevada highway.
      The claim: five hundred and thirty-three kilometres per hour one way, and an average of five hundred and eight. A new world record, by more than sixty.
      [dramatic]: Then the video goes online, and people start to check it.
      They time the car between landmarks on the road. It seems to be going far slower than the numbers on the screen.
      The company that supplied the GPS equipment says it never validated the run. Guinness confirms none of its officials were there.
      [dramatic]: Within weeks, SSC admits the video was, in its own words, substantially incorrect. It blames an editing mix-up, and promises to run again.
      In January twenty twenty-one, on a runway at the Kennedy Space Center, a Tuatara runs again, with independent GPS data and one of its loudest critics invited to watch.
      Four hundred and fifty-five kilometres per hour, averaged. Fast, but more than fifty below the claim.
      [hushed]: The five hundred wall was still standing.
