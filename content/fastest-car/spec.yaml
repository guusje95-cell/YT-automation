  - id: wall
    chapter: "The wall"
    narration: |
      September, twenty twenty-five. A test track in northern Germany, at Papenburg.
      A hypercar from Yangwang, the luxury brand of China's BYD, called the U9 Xtreme.
      With Marc Basseng at the wheel, it reaches four hundred and ninety-six point two kilometres per hour. Faster than the Bugatti.
      [dramatic]: One hundred and twenty-six years after La Jamais Contente, the highest speed ever recorded by a production car belongs to an electric car again.
      But it ran in one direction only. Rule one, again. Officially, nobody has beaten five hundred.
      BYD says the car is coming back this November, to the same track, to go past five hundred. Reports from the first run say the driver still had about one and a half seconds of full throttle left.
      [hushed]: So will it count? That depends on the two rules.
